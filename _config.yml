# ---------------------------------------------------------------
# Site settings. Edit these first.
# ---------------------------------------------------------------
title: Tushar Desai
description: >-
  Forecasting, optimisation and state estimation for energy systems:
  batteries and electricity markets.
url: "https://tkdesai13.github.io"   # replace tkdesai13 with your GitHub username
baseurl: ""                          # leave empty for a tkdesai13.github.io repo

author:
  name: Tushar Desai
  email: tkdesai13@gmail.com
  location: Amsterdam, the Netherlands
  github: tkdesai13                   # GitHub username
  linkedin: "desaitk"
  scholar: "if1o1dEAAAAJ"            # Google Scholar user id

# Profiles that belong to the same person as this site (read by Google and other search engines)
social:
  name: Tushar Desai
  links:
    - https://www.linkedin.com/in/desaitk
    - https://scholar.google.com/citations?user=if1o1dEAAAAJ
    - https://github.com/tkdesai13

# Navigation (order matters)
nav:
  - title: About
    url: /
  - title: Resume
    url: /resume/
  - title: Blog
    url: /blog/

# ---------------------------------------------------------------
# Build settings (GitHub Pages compatible, no need to change)
# ---------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  math_engine: null        # MathJax renders $...$ and $$...$$ in the browser
  syntax_highlighter: rouge
permalink: /blog/:year/:month/:title/
timezone: Europe/Amsterdam

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: /feed.xml
  xsl: true            # styles the feed when opened in a browser (feed.xslt.xml)

# Every post gets the post layout and MathJax unless it says otherwise.
defaults:
  - scope: { path: "", type: posts }
    values: { layout: post, math: true }
  - scope: { path: "", type: drafts }
    values: { layout: post, math: true }
  - scope: { path: "" }               # preview image when any page is shared (LinkedIn, Slack, etc.)
    values:
      image:
        path: /assets/img/social-card.png
        width: 1200
        height: 630
        alt: "Tushar Desai: forecasting, optimisation and state estimation for energy systems"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
